spring.application.name=blog-service
server.port=8083

spring.datasource.url=jdbc:mysql://localhost:3307/veggiepal_blog?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=12345

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

jwt.secret=${JWT_SECRET:veggiepal-secret-key-must-be-at-least-32-characters}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Cloudinary credentials come from the repo-root .env (gitignored; template: .env.example).
# ../.env when run from this directory (mvnw, tests), .env when an IDE runs from the repo root.
# Empty defaults keep the context loadable without .env; only uploads then fail (503).
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
storage.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
storage.cloudinary.api-key=${CLOUDINARY_API_KEY:}
storage.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Blog thumbnails are bigger than avatars. Sized strictly above
# BlogService.MAX_THUMBNAIL_BYTES (5MB) so the service's own size check
# (-> THUMBNAIL_TOO_LARGE) runs before the parser would reject the upload outright.
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=7MB

spring.application.name=blog-service
server.port=${BLOG_SERVICE_PORT:8083}
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/veggiepal_blog?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

jwt.secret=${JWT_SECRET:veggiepal-secret-key-must-be-at-least-32-characters}

services.ai.base-url=${AI_SERVICE_URL:http://localhost:8086}
services.ai.connect-timeout=${AI_SERVICE_CONNECT_TIMEOUT:3s}
services.ai.read-timeout=${AI_SERVICE_READ_TIMEOUT:20s}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

storage.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
storage.cloudinary.api-key=${CLOUDINARY_API_KEY:}
storage.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Blog thumbnails are bigger than avatars. Sized strictly above
# BlogService.MAX_THUMBNAIL_BYTES (5MB) so the service's own size check
# (-> THUMBNAIL_TOO_LARGE) runs before the parser would reject the upload outright.
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=7MB
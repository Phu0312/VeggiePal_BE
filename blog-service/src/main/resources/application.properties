spring.application.name=blog-service
server.port=${BLOG_SERVICE_PORT:8083}
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

spring.datasource.url=jdbc:mysql://${DB_HOST:veggiepal-mysql-veggiepal-web.f.aivencloud.com}:${DB_PORT:19457}/${DB_BLOG_NAME:veggiepal_blog_clean}?createDatabaseIfNotExist=true&sslMode=${DB_SSL_MODE:REQUIRED}
spring.datasource.username=${DB_USERNAME:avnadmin}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


jwt.secret=${JWT_SECRET:veggiepal-secret-key-must-be-at-least-32-characters}

services.ai.base-url=${AI_SERVICE_URL:http://localhost:8086}
services.ai.connect-timeout=${AI_SERVICE_CONNECT_TIMEOUT:3s}
services.ai.read-timeout=${AI_SERVICE_READ_TIMEOUT:20s}
services.internal-token=${INTERNAL_SERVICE_TOKEN:}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

storage.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
storage.cloudinary.api-key=${CLOUDINARY_API_KEY:}
storage.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Task sheet US4: uploaded videos are .mp4 and at most this size. Raising it means raising
# the two multipart limits below too.
video.max-file-size=${VIDEO_MAX_FILE_SIZE:30MB}

# Sized strictly above video.max-file-size (and so above BlogService.MAX_THUMBNAIL_BYTES, 5MB)
# so the services' own size checks (-> VIDEO_TOO_LARGE / THUMBNAIL_TOO_LARGE) run before the
# parser rejects the upload outright.
spring.servlet.multipart.max-file-size=31MB
spring.servlet.multipart.max-request-size=32MB

# Flyway creates the schema and loads initial data automatically on service startup.
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true

# Bound the total number of connections used by the seven services on Aiven.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:2}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}

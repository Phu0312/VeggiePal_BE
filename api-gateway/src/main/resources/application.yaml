server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:

            # =========================
            # IDENTITY SERVICE
            # =========================
            - id: identity-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/auth/**
              filters:
                - StripPrefix=1

            - id: identity-service-users
              uri: http://localhost:8081
              predicates:
                - Path=/api/users/**
              filters:
                - StripPrefix=1

            - id: identity-service-docs
              uri: http://localhost:8081
              predicates:
                - Path=/identity-service/v3/api-docs/**
              filters:
                - StripPrefix=1


            # =========================
            # NUTRITION SERVICE
            # =========================
            - id: nutrition-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/nutrition/**
              filters:
                - StripPrefix=1

            - id: nutrition-service-docs
              uri: http://localhost:8082
              predicates:
                - Path=/nutrition-service/v3/api-docs/**
              filters:
                - StripPrefix=1


            # =========================
            # BLOG SERVICE
            # =========================
            - id: blog-service-blogs
              uri: http://localhost:8083
              predicates:
                - Path=/api/blogs/**
              filters:
                - StripPrefix=1

            - id: blog-service-categories
              uri: http://localhost:8083
              predicates:
                - Path=/api/categories/**
              filters:
                - StripPrefix=1

            - id: blog-service-comments
              uri: http://localhost:8083
              predicates:
                - Path=/api/comments/**
              filters:
                - StripPrefix=1

            - id: blog-service-docs
              uri: http://localhost:8083
              predicates:
                - Path=/blog-service/v3/api-docs/**
              filters:
                - StripPrefix=1


            # =========================
            # RECIPE SERVICE
            # =========================

            # Ingredient APIs
            - id: recipe-service-ingredients
              uri: http://localhost:8084
              predicates:
                - Path=/api/ingredients/**
              filters:
                - StripPrefix=1

            # Recipe APIs
            - id: recipe-service-recipes
              uri: http://localhost:8084
              predicates:
                - Path=/api/recipes/**
              filters:
                - StripPrefix=1

            # Recipe Swagger Docs
            - id: recipe-service-docs
              uri: http://localhost:8084
              predicates:
                - Path=/recipe-service/v3/api-docs/**
              filters:
                - StripPrefix=1

            # =========================
            # LOCATION SERVICE
            # =========================
            - id: location-service-restaurants
              uri: http://localhost:8085
              predicates:
                - Path=/api/restaurants/**
              filters:
                - StripPrefix=1

            - id: location-service-docs
              uri: http://localhost:8085
              predicates:
                - Path=/location-service/v3/api-docs/**
              filters:
                - StripPrefix=1


# =========================
# SWAGGER UI TỔNG
# =========================
springdoc:
  swagger-ui:
    path: /swagger-ui.html

    urls:
      - name: Identity Service
        url: /identity-service/v3/api-docs

      - name: Nutrition Service
        url: /nutrition-service/v3/api-docs

      - name: Blog Service
        url: /blog-service/v3/api-docs

      - name: Recipe Service
        url: /recipe-service/v3/api-docs

      - name: Location Service
        url: /location-service/v3/api-docs
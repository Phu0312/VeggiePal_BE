spring.application.name=location-service
server.port=${LOCATION_SERVICE_PORT:8085}
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

spring.datasource.url=jdbc:mysql://${DB_HOST:veggiepal-mysql-veggiepal-web.f.aivencloud.com}:${DB_PORT:19457}/${DB_LOCATION_NAME:veggiepal_location_clean}?createDatabaseIfNotExist=true&sslMode=${DB_SSL_MODE:REQUIRED}
spring.datasource.username=${DB_USERNAME:avnadmin}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET:veggiepal-secret-key-must-be-at-least-32-characters}

# UTF-8 for any explicitly configured test SQL initialization
spring.sql.init.encoding=UTF-8

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
# Flyway creates the schema and loads initial data automatically on service startup.
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true

# Bound the total number of connections used by the seven services on Aiven.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:2}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}

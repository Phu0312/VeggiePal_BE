name: veggiepal

services:
  mysql:
    image: mysql:8.4
    container_name: veggiepal-mysql
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-12345}
      MYSQL_DATABASE: veggiepal

    ports:
      # Cổng 3307 trên host được map vào cổng 3306 của container
      - "${DOCKER_MYSQL_HOST_PORT:-3307}:3306"

    volumes:
      - mysql_data:/var/lib/mysql


  identity-service:
    build:
      context: ./identity-service
      dockerfile: Dockerfile

    container_name: veggiepal-identity
    restart: unless-stopped

    ports:
      - "8081:8081"

    # Nạp các biến môi trường từ file .env chung
    env_file:
      - path: .env
        required: false

    environment:
      # Trong mạng Docker, service kết nối trực tiếp đến container mysql ở cổng nội bộ 3306
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-12345}
      JWT_SECRET: ${JWT_SECRET:-veggiepal-secret-key-must-be-at-least-32-characters}

    depends_on:
      - mysql

  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: veggiepal-payment
    restart: unless-stopped
    ports:
      - "8087:8087"
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-12345}
      JWT_SECRET: ${JWT_SECRET:-veggiepal-secret-key-must-be-at-least-32-characters}
    depends_on:
      - mysql



volumes:
  mysql_data:


name: veggiepal

x-service-defaults: &service-defaults
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  networks:
    - backend

x-database-environment: &database-environment
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_USERNAME: ${DB_USERNAME:-root}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "4"
  SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "1"

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    mem_limit: 640m
    command:
      - --innodb-buffer-pool-size=128M
      - --max-connections=60
      - --performance-schema=OFF
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  
  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    command:
      - http
      - api-gateway:8080
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?NGROK_AUTHTOKEN must be set}
    ports:
      - "127.0.0.1:4040:4040"
    networks:
      - backend
    depends_on:
      api-gateway:
        condition: service_healthy

  identity-service:
    <<: *service-defaults
    mem_limit: 576m
    build:
      context: ./identity-service
    environment:
      <<: *database-environment
      IDENTITY_SERVICE_PORT: "8081"
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx256m -XX:ActiveProcessorCount=2
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8081/v3/api-docs"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s

  nutrition-service:
    <<: *service-defaults
    mem_limit: 512m
    build:
      context: ./nutrition-service
    environment:
      <<: *database-environment
      NUTRITION_SERVICE_PORT: "8082"
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx224m -XX:ActiveProcessorCount=2
      AI_SERVICE_URL: http://ai-service:8086
      RECIPE_SERVICE_URL: http://recipe-service:8084
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8082/v3/api-docs"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s

  blog-service:
    <<: *service-defaults
    mem_limit: 576m
    build:
      context: ./blog-service
    environment:
      <<: *database-environment
      BLOG_SERVICE_PORT: "8083"
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx256m -XX:ActiveProcessorCount=2
      IDENTITY_SERVICE_URL: http://identity-service:8081
      AI_SERVICE_URL: http://ai-service:8086
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN must be set in .env}
    depends_on:
      mysql:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8083/v3/api-docs"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s

  recipe-service:
    <<: *service-defaults
    mem_limit: 576m
    build:
      context: ./recipe-service
    environment:
      <<: *database-environment
      RECIPE_SERVICE_PORT: "8084"
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx256m -XX:ActiveProcessorCount=2
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8084/v3/api-docs"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s

  location-service:
    <<: *service-defaults
    mem_limit: 448m
    build:
      context: ./location-service
    environment:
      <<: *database-environment
      LOCATION_SERVICE_PORT: "8085"
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx192m -XX:ActiveProcessorCount=2
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8085/v3/api-docs"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s

  ai-service:
    <<: *service-defaults
    mem_limit: 768m
    build:
      context: ./ai-service
    environment:
      <<: *database-environment
      AI_SERVICE_PORT: "8086"
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx320m -XX:ActiveProcessorCount=2
      AI_VIDEO_WORKERS: "1"
      AI_VIDEO_QUEUE_CAPACITY: "2"
      IDENTITY_SERVICE_URL: http://identity-service:8081
      BLOG_SERVICE_URL: http://blog-service:8083
      RECIPE_SERVICE_URL: http://recipe-service:8084
      NUTRITION_SERVICE_URL: http://nutrition-service:8082
      PAYMENT_SERVICE_URL: http://payment-service:8087
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN must be set in .env}
      FFMPEG_PATH: ffmpeg
      FFPROBE_PATH: ffprobe
    depends_on:
      mysql:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      nutrition-service:
        condition: service_healthy
      recipe-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8086/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s

  payment-service:
    <<: *service-defaults
    mem_limit: 448m
    build:
      context: ./payment-service
    environment:
      <<: *database-environment
      PAYMENT_SERVICE_PORT: "8087"
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx192m -XX:ActiveProcessorCount=2
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN must be set in .env}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8087/v3/api-docs"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s

  api-gateway:
    <<: *service-defaults
    mem_limit: 384m
    build:
      context: ./api-gateway
    ports:
      - "${GATEWAY_HOST_PORT:-8080}:8080"
    environment:
      GATEWAY_PORT: "8080"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:*,http://127.0.0.1:*,https://localhost:*,https://127.0.0.1:*}
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx160m -XX:ActiveProcessorCount=2
      IDENTITY_SERVICE_URL: http://identity-service:8081
      NUTRITION_SERVICE_URL: http://nutrition-service:8082
      BLOG_SERVICE_URL: http://blog-service:8083
      RECIPE_SERVICE_URL: http://recipe-service:8084
      LOCATION_SERVICE_URL: http://location-service:8085
      AI_SERVICE_URL: http://ai-service:8086
      PAYMENT_SERVICE_URL: http://payment-service:8087
    depends_on:
      identity-service:
        condition: service_healthy
      nutrition-service:
        condition: service_healthy
      blog-service:
        condition: service_healthy
      recipe-service:
        condition: service_healthy
      location-service:
        condition: service_healthy
      ai-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

networks:
  backend:
    driver: bridge

volumes:
  mysql_data:

spring.datasource.url=jdbc:h2:mem:payment;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
jwt.secret=veggiepal-test-secret-key-must-be-at-least-32-characters
payos.client-id=test-client
payos.api-key=test-api-key
payos.checksum-key=test-checksum-key
payos.return-url=http://localhost/payment/success
payos.cancel-url=http://localhost/payment/cancel
internal.service-token=test-internal-service-token-at-least-32-characters

spring.flyway.enabled=false

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:db/migration/V2__reference_data.sql

spring.application.name=ai-service
server.port=${AI_SERVICE_PORT:8086}
server.forward-headers-strategy=framework
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

groq.api.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}
groq.api.key=${GROQ_API_KEY:}
groq.api.connect-timeout=${GROQ_CONNECT_TIMEOUT:5s}
groq.api.read-timeout=${GROQ_READ_TIMEOUT:45s}
groq.api.max-retries=${GROQ_MAX_RETRIES:2}
groq.model.chat=${GROQ_CHAT_MODEL:openai/gpt-oss-20b}
groq.model.moderation=${GROQ_MODERATION_MODEL:openai/gpt-oss-20b}
groq.model.recommendation=${GROQ_RECOMMENDATION_MODEL:openai/gpt-oss-20b}
groq.model.meal-plan=${GROQ_MEAL_PLAN_MODEL:openai/gpt-oss-20b}
groq.model.video-extraction=${GROQ_VIDEO_EXTRACTION_MODEL:openai/gpt-oss-20b}
groq.model.transcription=${GROQ_TRANSCRIPTION_MODEL:whisper-large-v3-turbo}

# MySQL
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/veggiepal_ai?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true

# JWT must match identity-service.
jwt.secret=${JWT_SECRET:veggiepal-secret-key-must-be-at-least-32-characters}

# Existing downstream APIs. AI never fabricates domain data.
services.blog.base-url=${BLOG_SERVICE_URL:http://localhost:8083}
services.recipe.base-url=${RECIPE_SERVICE_URL:http://localhost:8084}
services.nutrition.base-url=${NUTRITION_SERVICE_URL:http://localhost:8082}
services.payment.base-url=${PAYMENT_SERVICE_URL:http://localhost:8087}
services.internal-token=${INTERNAL_SERVICE_TOKEN:}

ai.chat.guest-daily-limit=${AI_GUEST_DAILY_LIMIT:3}
ai.chat.member-daily-limit=${AI_MEMBER_DAILY_LIMIT:50}
ai.guest.session-pepper=${AI_GUEST_SESSION_PEPPER:${jwt.secret:${JWT_SECRET:veggiepal-secret-key-must-be-at-least-32-characters}}}
ai.guest.session-ttl=${AI_GUEST_SESSION_TTL:24h}
ai.guest.max-sessions-per-ip-per-day=${AI_GUEST_MAX_SESSIONS_PER_IP_PER_DAY:3}
ai.chat.max-history-messages=${AI_CHAT_MAX_HISTORY:12}
ai.chat.max-input-characters=${AI_CHAT_MAX_INPUT_CHARS:4000}
ai.token.daily-limit=${AI_DAILY_TOKEN_LIMIT:50000}
ai.video.ffmpeg-path=${FFMPEG_PATH:ffmpeg}
ai.video.ffprobe-path=${FFPROBE_PATH:ffprobe}
ai.video.max-file-bytes=${AI_VIDEO_MAX_BYTES:104857600}
ai.video.max-duration-seconds=${AI_VIDEO_MAX_DURATION_SECONDS:1800}

# The service, not the gateway, owns multipart parsing and must accept the documented video size.
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=105MB

ai.meal-plan.min-portion-scale=${AI_MEAL_PLAN_MIN_PORTION_SCALE:0.75}
ai.meal-plan.max-portion-scale=${AI_MEAL_PLAN_MAX_PORTION_SCALE:2.00}

# Actuator
management.endpoints.web.exposure.include=health,info

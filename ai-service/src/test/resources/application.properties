spring.datasource.url=jdbc:h2:mem:veggiepal_ai;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
groq.api.key=test-key
groq.api.base-url=http://localhost:1
groq.api.connect-timeout=1s
groq.api.read-timeout=1s
groq.api.max-retries=0
groq.model.chat=test-chat
groq.model.moderation=test-moderation
groq.model.recommendation=test-recommendation
groq.model.meal-plan=test-meal-plan
groq.model.video-extraction=test-video
groq.model.transcription=test-whisper
jwt.secret=test-secret-that-is-at-least-thirty-two-bytes-long
services.blog.base-url=http://localhost:1
services.recipe.base-url=http://localhost:1
services.nutrition.base-url=http://localhost:1
ai.chat.guest-daily-limit=3
ai.chat.member-daily-limit=50
ai.chat.max-history-messages=12
ai.chat.max-input-characters=4000
ai.guest.session-pepper=test-guest-session-pepper
ai.guest.session-ttl=24h
ai.guest.max-sessions-per-ip-per-day=3
ai.token.daily-limit=50000
ai.video.ffmpeg-path=ffmpeg
ai.video.max-file-bytes=104857600
ai.video.ffprobe-path=ffprobe
ai.video.max-duration-seconds=1800
ai.meal-plan.target-tolerance-ratio=0.15
ai.meal-plan.min-portion-scale=0.75
ai.meal-plan.max-portion-scale=1.50

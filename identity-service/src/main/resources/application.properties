spring.application.name=identity-service
server.port=${IDENTITY_SERVICE_PORT:8081}
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/veggiepal_identity?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# data.sql seeds blog-service's seed authors (ids 1-3); it must run after Hibernate creates the tables
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

jwt.secret=${JWT_SECRET:veggiepal-secret-key-must-be-at-least-32-characters}
# task_be C11: access tokens are short; the refresh token carries the 7-day session (task sheet US1)
jwt.access-ttl=${JWT_ACCESS_TTL:}
jwt.refresh-ttl=${JWT_REFRESH_TTL:}

google.client-id=${GOOGLE_CLIENT_ID:}

storage.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
storage.cloudinary.api-key=${CLOUDINARY_API_KEY:}
storage.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# task_be C10/C11: empty host fails closed unless local code logging is enabled.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
otp.log-codes=${OTP_LOG_CODES:false}
